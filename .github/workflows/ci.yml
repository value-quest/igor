name: CI

on:
  push:
    branches: [main, linux-wsl-support]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet -mod=readonly ./...

      - name: Test (unit + bash backwards-compatibility)
        run: go test -mod=readonly -race -v ./...

      - name: Build
        run: make build && ./igor --version
