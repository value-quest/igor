version: 2

project_name: igor

before:
  hooks:
    - go mod tidy
    - go test -mod=readonly ./...

builds:
  - id: igor
    main: ./cmd/igor
    binary: igor
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - arm64
      - amd64
    ldflags:
      - -s -w -X github.com/value-quest/igor/internal/cli.Version={{.Version}}

archives:
  - id: tarball
    ids:
      - igor
    formats:
      - tar.gz
    name_template: "igor_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
  - id: binary
    ids:
      - igor
    formats:
      - binary
    name_template: "igor-{{ .Os }}-{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
